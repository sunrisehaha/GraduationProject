<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .route {
      stroke-dasharray: 8 5;
      animation: routeMove 1.8s linear infinite;
    }

    .cart {
      animation: cartPulse 1.6s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes routeMove {
      to {
        stroke-dashoffset: -26;
      }
    }

    @keyframes cartPulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }
  </style>

  <rect width="64" height="64" rx="16" fill="#eaf7f4"/>
  <path
    class="route"
    d="M14 42 C21 26 33 47 49 19"
    fill="none"
    stroke="#0ea5e9"
    stroke-width="5"
    stroke-linecap="round"
  />
  <circle cx="14" cy="42" r="6" fill="#34d399"/>
  <circle cx="49" cy="19" r="6" fill="#f97316"/>

  <g class="cart">
    <rect x="23" y="27" width="20" height="13" rx="4" fill="#20313d"/>
    <rect x="27" y="22" width="12" height="8" rx="3" fill="#54b9d9"/>
    <circle cx="28" cy="42" r="3" fill="#20313d"/>
    <circle cx="39" cy="42" r="3" fill="#20313d"/>
    <circle cx="33" cy="34" r="13" fill="none" stroke="#34d399" stroke-width="3" opacity="0.45"/>
  </g>
</svg>
