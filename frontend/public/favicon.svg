<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="智慧园区快递配送系统图标">
  <style>
    .route {
      stroke-dasharray: 18 10;
      animation: routeFlow 2.4s linear infinite;
    }

    .cart {
      animation: cartGlide 2.4s ease-in-out infinite;
      transform-origin: 33px 33px;
    }

    .pulse {
      animation: nodePulse 2.4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes routeFlow {
      to {
        stroke-dashoffset: -56;
      }
    }

    @keyframes cartGlide {
      0%,
      100% {
        transform: translate(-2px, 2px) rotate(-8deg);
      }

      50% {
        transform: translate(3px, -3px) rotate(-8deg);
      }
    }

    @keyframes nodePulse {
      0%,
      100% {
        opacity: 0.28;
        transform: scale(0.82);
      }

      50% {
        opacity: 0.58;
        transform: scale(1.1);
      }
    }
  </style>

  <defs>
    <linearGradient id="shellGradient" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7fcff"/>
      <stop offset="0.48" stop-color="#e6f5fb"/>
      <stop offset="1" stop-color="#d9eef7"/>
    </linearGradient>

    <linearGradient id="routeGradient" x1="14" y1="47" x2="50" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1fbf86"/>
      <stop offset="0.52" stop-color="#20a7e8"/>
      <stop offset="1" stop-color="#2f6fec"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#2c6f9d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="5" y="5" width="54" height="54" rx="18" fill="url(#shellGradient)" filter="url(#softShadow)"/>
  <path d="M32 10.5 50.5 21.2v21.6L32 53.5 13.5 42.8V21.2L32 10.5Z" fill="#ffffff" opacity="0.58"/>
  <path d="M32 13.8 47.6 22.8v18.4L32 50.2 16.4 41.2V22.8L32 13.8Z" fill="none" stroke="#8fc7da" stroke-width="2.2" opacity="0.7"/>

  <path
    class="route"
    d="M18 43 C23 31 31 43 36 31 S44 21 49 18"
    fill="none"
    stroke="url(#routeGradient)"
    stroke-width="4.4"
    stroke-linecap="round"
  />

  <circle class="pulse" cx="18" cy="43" r="7.5" fill="#1fbf86"/>
  <circle cx="18" cy="43" r="3.8" fill="#16a874"/>
  <circle class="pulse" cx="49" cy="18" r="7.5" fill="#2f6fec"/>
  <circle cx="49" cy="18" r="3.8" fill="#245ee0"/>

  <g class="cart">
    <rect x="27" y="28" width="18" height="11" rx="3.5" fill="#18324a"/>
    <path d="M30 25.5h8.8c2 0 3.7 1.3 4.2 3.2H28.5c.2-1.8.8-3.2 1.5-3.2Z" fill="#28aee4"/>
    <path d="M30.5 31h10.8" stroke="#e7f8ff" stroke-width="1.7" stroke-linecap="round" opacity="0.78"/>
    <circle cx="31.5" cy="40" r="2.6" fill="#18324a"/>
    <circle cx="40.2" cy="40" r="2.6" fill="#18324a"/>
  </g>
</svg>
